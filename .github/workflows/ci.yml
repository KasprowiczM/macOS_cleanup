name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-checks:
    name: Portable checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Syntax check
        run: |
          fail=0
          for f in cleanup_all.sh lib/*.sh config/*.sh tests/*.sh tools/*.sh i18n/*.sh dev-sync/*.sh dev-sync-*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || fail=1
          done
          exit $fail

      - name: Python dev-sync tests
        run: python3 -m unittest tests/test_dev_sync_safety.py

      - name: Python syntax
        run: python3 -m py_compile dev-sync/*.py tests/test_dev_sync_safety.py

      - name: Shellcheck
        run: shellcheck -S warning cleanup_all.sh lib/*.sh config/*.sh

  macos-release-gates:
    name: macOS release gates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Syntax check
        run: |
          fail=0
          for f in cleanup_all.sh lib/*.sh config/*.sh tests/*.sh tools/*.sh i18n/*.sh dev-sync/*.sh dev-sync-*.sh; do
            [ -f "$f" ] || continue
            /bin/bash -n "$f" || fail=1
          done
          exit $fail

      - name: Shell tests (System bash 3.2)
        run: /bin/bash tests/run_all.sh

      - name: Python dev-sync tests
        run: python3 -m unittest tests/test_dev_sync_safety.py

      - name: Python syntax
        run: python3 -m py_compile dev-sync/*.py tests/test_dev_sync_safety.py

      - name: Ensure shellcheck is available
        run: command -v shellcheck >/dev/null 2>&1 || brew install shellcheck

      - name: Shellcheck
        run: shellcheck -S warning cleanup_all.sh lib/*.sh config/*.sh

      - name: Generate a plan for schema validation
        run: /bin/bash cleanup_all.sh --dry-run --non-interactive --category trash 2>/dev/null || true

      - name: Validate plan schema
        shell: python3 {0}
        run: |
          import glob, json, sys
          plans = sorted(glob.glob("reports/plan_*.json"))
          if not plans:
              sys.exit("No plan generated")
          plan = json.load(open(plans[-1]))
          assert "operations" in plan and "summary" in plan, "missing top-level keys"
          for op in plan["operations"]:
              assert op["risk"] in ("SAFE", "REVIEW", "DANGEROUS"), "bad risk: %s" % op["risk"]
          print("Plan validated: %d operations" % len(plan["operations"]))

      # G09 validates the plan with the Python jsonschema module; the runner's
      # Python is externally managed, so it goes into a throwaway venv.
      - name: Install jsonschema for plan validation (G09)
        run: |
          python3 -m venv "$RUNNER_TEMP/jsonschema-venv"
          "$RUNNER_TEMP/jsonschema-venv/bin/pip" install --quiet jsonschema
          echo "$RUNNER_TEMP/jsonschema-venv/bin" >> "$GITHUB_PATH"

      - name: Release verification gates
        run: /bin/bash tools/verify_release.sh

