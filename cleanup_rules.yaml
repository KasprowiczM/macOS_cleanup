        notes: "Persistent cache Spotify (streaming data). Spotify pobierze ponownie."

# ---------------------------------------------------------------------------
# KOPIE ZAPASOWE iOS
# ---------------------------------------------------------------------------
ios_backups:
  - name: "iOS/iPadOS/watchOS Backups"
    bundle_ids: []
    type: backup
    paths:
      - path: "~/Library/Application Support/MobileSync/Backup"
        type: data
        safety: ask
        notes: >
          Lokalne kopie zapasowe urządzeń Apple (iPhone, iPad, Apple Watch).
          UWAGA: Usuń tylko jeśli masz backup w iCloud LUB nie potrzebujesz
          odtwarzać urządzenia z tego komputera.
          Skrypt pyta o każdy backup indywidualnie.

# ---------------------------------------------------------------------------
# TIME MACHINE
# ---------------------------------------------------------------------------
time_machine:
  - name: "Time Machine Local Snapshots"
    bundle_ids: []
    type: backup
    paths:
      - path: "__tm_snapshots__"
        type: cache
        safety: ask
        notes: >
          Lokalne snapshoty APFS Time Machine.
          macOS usuwa je automatycznie gdy potrzebuje miejsca (purgeable space).
          Możesz usunąć ręcznie jeśli masz aktualny backup na dysku zewnętrznym.
          Komenda: tmutil deletelocalsnapshots <data>
