# ---------------------------------------------------------------------------
# APLIKACJE KREATYWNE
# ---------------------------------------------------------------------------
creative:
  - name: "Adobe Creative Cloud"
    bundle_ids:
      - "com.adobe.acc.installer"
    type: media-editor
    paths:
      - path: "~/Library/Caches/Adobe"
        type: cache
        safety: ask
        notes: "Cache Adobe — może być bardzo duże (>10 GB). Bezpieczne do usunięcia."

      - path: "~/Library/Application Support/Adobe/Common/Media Cache Files"
        type: cache
        safety: ask
        notes: >
          Cache mediów Premiere Pro, After Effects.
          Bezpieczne — przeliczone przy następnym otwarciu projektu.

      - path: "~/Library/Application Support/Adobe/Common/Media Cache"
        type: cache
        safety: ask
        notes: "Index cache mediów Adobe."

      - path: "~/Library/Application Support/Adobe"
        type: data
        safety: never
        notes: >
          NIE USUWAJ W CAŁOŚCI. Zawiera ustawienia, presets, workspace.
          Usuń tylko specyficzne podkatalogi cache.

  - name: "Figma"
    bundle_ids:
      - "com.figma.Desktop"
    type: media-editor
    paths:
      - path: "~/Library/Caches/com.figma.Desktop"
        type: cache
        safety: ask
        notes: "Cache Figma — bezpieczne."

      - path: "~/Library/Application Support/Figma"
        type: data
        safety: never
        notes: "Dane Figma (offline copies, fonts) — nie usuwaj."

